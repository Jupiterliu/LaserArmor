[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laserarmor"
version = "1.0.0"
description = "Laser attack detection and image restoration evaluation code"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.7",
  "joblib>=1.3",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "shapely>=2.0",
  "timm>=0.9",
  "torch>=2.1"
]

[tool.setuptools.packages.find]
include = ["laserarmor*"]
